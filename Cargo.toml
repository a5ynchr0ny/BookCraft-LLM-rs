[package]
name = "bookcraft"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Multi-agent literary translation pipeline: translation bible, two-pass drafting, 3-level QA, lossless EPUB rebuild"
license = "MIT"
readme = "README.md"

[dependencies]
aho-corasick = "1"
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
dotenvy = "0.15"
futures = "0.3"
html5ever = "0.40"
markup5ever_rcdom = "0.40.1"
minijinja = { version = "3", features = ["serde"] }
percent-encoding = "2"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "query"] }
roxmltree = "0.21"
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "time", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zip = { version = "9", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
